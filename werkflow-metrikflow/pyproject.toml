# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "werkflow-metrikflow"
version = "0.3.1"
requires-python = ">=3.11"
description = "A library for processing and sending metrics."
readme = "README.md"
authors = [{ name = "Ada Lundhe", email = "adalundhe@lundhe.audio" }]
license-files = [ "LICENSE" ]
classifiers = [
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Operating System :: OS Independent",
]
keywords = [
    'pypi',
    'cicd',
    'python',
    'werkflow',
    'workflow',
    'metrikflow',
    'stats',
    'stats-integrations',
    'datadog',
    'reporting',
]
dependencies = [
    'datadog-api-client<2.50.0',
    'metrikflow',
    'werkflow-core',
    'werkflow-shell',
]

[project.urls]
Homepage = "https://github.com/adalundhe/werkflow-modules/tree/main/werkflow-metrikflow"

[tool.setuptools.packages]
find = {}  # Scanning implicit namespaces is active by default
